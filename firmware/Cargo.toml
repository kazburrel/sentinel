name         = "firmware"
rust-version = "1.88"
version      = "0.1.0"

[[bin]]
name = "firmware"
path = "./src/bin/main.rs"

[[bin]]
name = "camera_test"
path = "./src/bin/camera_test.rs"

[[bin]]
name = "video_test"
path = "./src/bin/video_test.rs"

[[bin]]
name = "mjpeg_test"
path = "./src/bin/mjpeg_test.rs"

[[bin]]
name = "uxga_test"
path = "./src/bin/uxga_test.rs"

[[bin]]
name = "uxga_video_test"
path = "./src/bin/uxga_video_test.rs"

[[bin]]
name = "psram_test"
path = "./src/bin/psram_test.rs"

[[bin]]
name = "psram_record_test"
path = "./src/bin/psram_record_test.rs"

[[bin]]
name = "motion_record_test"
path = "./src/bin/motion_record_test.rs"

[[bin]]
name = "wifi_test"
path = "./src/bin/wifi_test.rs"

[[bin]]
name = "wifi_scan_test"
path = "./src/bin/wifi_scan_test.rs"

[[bin]]
name = "http_post_test"
path = "./src/bin/http_post_test.rs"

[[bin]]
